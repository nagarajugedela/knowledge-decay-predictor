<!DOCTYPE html>
<html>

<head>

    <title>Analytics | Knowledge Decay Predictor</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="dashboard-bg">

<div class="container">

    <div class="table-card">

        <h2 class="text-center mb-4">

            📊 Analytics Dashboard

        </h2>

        <!-- Statistics -->

        <div class="row mb-4">

            <div class="col-md-4">

                <div class="card p-4 text-center">

                    <h5>Total Topics</h5>

                    <h2>
                        {{ total_topics }}
                    </h2>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card p-4 text-center">

                    <h5>Average Retention</h5>

                    <h2>
                        {{ average_retention }}%
                    </h2>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card p-4 text-center">

                    <h5>High Risk Topics</h5>

                    <h2>
                        {{ high_risk }}
                    </h2>

                </div>

            </div>

        </div>

        <!-- Chart 1 -->

        <div class="card p-4 mb-4">

            <h4 class="mb-3">

                Retention Analysis

            </h4>

            <canvas id="retentionChart"></canvas>

        </div>

        <!-- Chart 2 -->

        <div class="card p-4 mb-4">

            <h4 class="mb-3 text-center">
              Topic Difficulty Distribution
             </h4>

         <div
             style="
             width:350px;
             height:350px;
              margin:auto;
             ">

             <canvas id="difficultyChart"></canvas>

             </div>

        </div>

        <div class="text-center mt-4">

            <a
            href="/dashboard"
            class="btn btn-secondary">

                Back To Dashboard

            </a>

        </div>

    </div>

</div>

<script>

const labels = {{ labels | tojson | safe }};
const retentions = {{ retentions | tojson | safe }};

new Chart(
document.getElementById('retentionChart'),
{
    type: 'bar',

    data: {
        labels: labels,

        datasets: [{
            label: 'Retention %',
            data: retentions,
            backgroundColor: '#2563eb'
        }]
    }
}
);

const difficultyLabels =
{{ difficulty_labels | tojson | safe }};

const difficultyData =
{{ difficulty_data | tojson | safe }};

new Chart(
document.getElementById('difficultyChart'),
{
    type: 'pie',

    data: {
        labels: difficultyLabels,

        datasets: [{
            data: difficultyData
        }]
    },

    options: {

        responsive: true,

        maintainAspectRatio: false,

        plugins: {

            legend: {
                position: 'bottom'
            }

        }

    }
}
);

</script>
</body>

</html>
