<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Topic | Knowledge Decay Predictor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container py-4">

    <!-- Page Header -->
    <div class="page-header">

        <div>
            <h2 class="page-title">Edit Topic</h2>

            <p class="page-subtitle">
                Update your study information
            </p>
        </div>

    </div>


    <!-- Edit Topic Card -->
    <div class="card shadow-sm border-0 p-4">

        <form method="POST">

            <!-- Topic Name -->
            <div class="mb-3">

                <label class="form-label">
                    Topic Name
                </label>

                <input
                    type="text"
                    name="topic_name"
                    class="form-control"
                    value="{{ topic.topic_name }}"
                    required>

            </div>


            <!-- Study Date -->
            <div class="mb-3">

                <label class="form-label">
                    Study Date
                </label>

                <input
                    type="date"
                    name="study_date"
                    class="form-control"
                    value="{{ topic.study_date }}"
                    required>

            </div>


            <!-- Study Duration -->
            <div class="mb-3">

                <label class="form-label">
                    Study Duration (minutes)
                </label>

                <input
                    type="number"
                    step="0.1"
                    name="study_duration"
                    class="form-control"
                    value="{{ topic.study_duration }}"
                    required>

            </div>


            <!-- Difficulty -->
            <div class="mb-3">

                <label class="form-label">
                    Difficulty
                </label>

                <select
                    name="difficulty"
                    class="form-select"
                    required>

                    <option
                        value="Easy"
                        {% if topic.difficulty == "Easy" %}
                        selected
                        {% endif %}>
                        Easy
                    </option>

                    <option
                        value="Medium"
                        {% if topic.difficulty == "Medium" %}
                        selected
                        {% endif %}>
                        Medium
                    </option>

                    <option
                        value="Hard"
                        {% if topic.difficulty == "Hard" %}
                        selected
                        {% endif %}>
                        Hard
                    </option>

                </select>

            </div>


            <!-- Confidence -->
            <div class="mb-3">

                <label class="form-label">
                    Confidence Score (1–10)
                </label>

                <input
                    type="number"
                    name="confidence_score"
                    class="form-control"
                    value="{{ topic.confidence_score }}"
                    min="1"
                    max="10"
                    required>

            </div>


            <!-- Revision Count -->
            <div class="mb-4">

                <label class="form-label">
                    Revision Count
                </label>

                <input
                    type="number"
                    name="revision_count"
                    class="form-control"
                    value="{{ topic.revision_count }}"
                    min="0"
                    required>

            </div>


            <!-- Buttons -->
            <button
                type="submit"
                class="btn btn-primary">

                Update Topic

            </button>

            <a
                href="{{ url_for('topics') }}"
                class="btn btn-secondary ms-2">

                Cancel

            </a>

        </form>

    </div>

</div>

</body>
</html>
