<!DOCTYPE html>
<html>
<head>

    <title>Edittopic | Knowledge Decay Predictor</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<h2>Edit Topic</h2>

<form method="POST">

    <label>Topic Name</label><br>
    <input type="text"
           name="topic_name"
           value="{{ topic.topic_name }}"
           required>

    <br><br>

    <label>Study Date</label><br>
    <input type="date"
           name="study_date"
           value="{{ topic.study_date }}"
           required>

    <br><br>

    <label>Study Duration</label><br>
    <input type="number"
           step="0.1"
           name="study_duration"
           value="{{ topic.study_duration }}"
           required>

    <br><br>

    <label>Difficulty</label><br>

    <select name="difficulty">

        <option {% if topic.difficulty == "Easy" %}selected{% endif %}>
            Easy
        </option>

        <option {% if topic.difficulty == "Medium" %}selected{% endif %}>
            Medium
        </option>

        <option {% if topic.difficulty == "Hard" %}selected{% endif %}>
            Hard
        </option>

    </select>

    <br><br>
    <label>Confidence Score</label><br>
    <input
     type="number"
     name="confidence_score"
     value="{{ topic.confidence_score }}"
     min="1"
     max="10">

    <br><br>

    <label>Revision Count</label><br>
    <input
        type="number"
        name="revision_count"
        value="{{ topic.revision_count }}"
        min="0">

        <button type="submit">
          Update Topic
        </button>

    </form>

</body>
</html>
