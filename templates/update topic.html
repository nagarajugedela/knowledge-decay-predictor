<!DOCTYPE html>
<html>
<head>

    <title>UpdateTopic| Knowledge Decay Predictor</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>
<tr>
    <th>Topic</th>
    <th>Date</th>
    <th>Duration</th>
    <th>Difficulty</th>
    <th>Edit</th>
    <th>Delete</th>
</tr>

{% for topic in topics %}

<tr>

<td>{{ topic.topic_name }}</td>
<td>{{ topic.study_date }}</td>
<td>{{ topic.study_duration }}</td>
<td>{{ topic.difficulty }}</td>

<td>
    <a href="/edit_topic/{{ topic.id }}">
        Edit
    </a>
</td>

<td>
    <a href="/delete_topic/{{topic.id}}"
    onclick="return confirm('Delete this topic?')">
    Delete
</a>
</td>

</tr>

{% endfor %}
</html>
