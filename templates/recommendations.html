<!DOCTYPE html>
<html>
<head>

    <title>Recommendations | Knowledge Decay Predictor</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<h2>Smart Revision Recommendations</h2>

<table border="1">

<tr>
    <th>Topic</th>
    <th>Retention</th>
    <th>Recommendation</th>
</tr>

{% for item in recommendations %}

<tr>

<td>{{ item.topic }}</td>

<td>{{ item.retention }}%</td>

<td>{{ item.priority }}</td>

</tr>

{% endfor %}

</table>

<br>

<a href="/dashboard">
Back To Dashboard
</a>

</body>
</html>
